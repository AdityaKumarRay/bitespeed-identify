<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitespeed — Identity Reconciliation API</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: #09090b;
        color: #a1a1aa;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        max-width: 440px;
        text-align: center;
        padding: 3rem 2rem;
      }

      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        color: #fafafa;
        letter-spacing: -0.02em;
        margin-bottom: 0.3rem;
      }

      .desc {
        font-size: 0.85rem;
        line-height: 1.5;
        color: #71717a;
        margin-bottom: 2rem;
      }

      /* ── Endpoints ── */
      .endpoints {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 2rem;
      }

      .endpoint {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.6rem 0.85rem;
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 8px;
        font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
        font-size: 0.8rem;
      }

      .method {
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0.15rem 0.45rem;
        border-radius: 3px;
        flex-shrink: 0;
      }

      .method-post {
        background: rgba(34, 197, 94, 0.12);
        color: #4ade80;
      }

      .method-get {
        background: rgba(59, 130, 246, 0.12);
        color: #60a5fa;
      }

      .path {
        color: #d4d4d8;
      }

      /* ── Footer links ── */
      .links {
        display: flex;
        justify-content: center;
        gap: 1.25rem;
        font-size: 0.78rem;
      }

      .links a {
        color: #52525b;
        text-decoration: none;
        transition: color 0.15s;
      }

      .links a:hover {
        color: #e4e4e7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Bitespeed Identity Reconciliation</h1>
      <p class="desc">Contact identification &amp; consolidation API for FluxKart.com</p>

      <div class="endpoints">
        <div class="endpoint">
          <span class="method method-post">POST</span>
          <span class="path">/identify</span>
        </div>
        <div class="endpoint">
          <span class="method method-get">GET</span>
          <span class="path">/health</span>
        </div>
      </div>

      <nav class="links">
        <a href="/health">Health</a>
        <a
          href="https://github.com/AdityaKumarRay/bitespeed-identify"
          target="_blank"
          rel="noopener"
          >GitHub</a
        >
      </nav>
    </div>
  </body>
</html>
